<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kongo Arena · Diagnóstico</title>
<style>
:root{--p:#212121;--d:#d4af37;--b:#fff;--ok:#2ecc71;--er:#e74c3c;--am:#f39c12;--c:#2c2c2c}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--p);color:var(--b);font-family:Bahnschrift,'Segoe UI',Arial,sans-serif;padding:24px}
.wrap{max-width:1000px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;border-bottom:2px solid var(--d);padding-bottom:16px;margin-bottom:22px}
.logo{width:46px;height:46px;border-radius:8px;background:linear-gradient(135deg,var(--d),#8a6d1f);display:flex;align-items:center;justify-content:center;color:var(--p);font-weight:700;font-size:20px}
h1{font-size:22px;letter-spacing:1px}h1 span{color:var(--d)}
.sub{font-size:12px;opacity:.7;margin-top:3px}
button{background:var(--d);color:var(--p);border:0;padding:12px 22px;border-radius:6px;font-weight:700;cursor:pointer;font-family:inherit;font-size:15px}
button:disabled{opacity:.5;cursor:wait}
.card{background:var(--c);border-radius:10px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lbl{font-weight:600;font-size:14px}.url{font-size:11px;opacity:.55;font-family:monospace;word-break:break-all}
.badge{padding:5px 12px;border-radius:16px;font-size:12px;font-weight:700;white-space:nowrap}
.on{background:rgba(46,204,113,.15);color:var(--ok);border:1px solid var(--ok)}
.off{background:rgba(231,76,60,.15);color:var(--er);border:1px solid var(--er)}
.warn{background:rgba(243,156,18,.15);color:var(--am);border:1px solid var(--am)}
.wait{background:rgba(255,255,255,.1);border:1px solid #555}
.sec{color:var(--d);text-transform:uppercase;letter-spacing:2px;font-size:14px;margin:20px 0 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:8px}
.stat{background:var(--c);border-top:3px solid var(--d);border-radius:10px;padding:14px;text-align:center}
.stat b{font-size:26px;display:block}.stat small{font-size:10px;opacity:.7;text-transform:uppercase;letter-spacing:1px}
.log{background:#111;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;max-height:200px;overflow:auto;line-height:1.8}
footer{text-align:center;opacity:.5;font-size:12px;margin-top:28px}
</style>
</head>
<body>
<div class="wrap">
<header>
 <div style="display:flex;gap:12px;align-items:center">
  <div class="logo">K</div>
  <div><h1>KONGO <span>ARENA</span></h1><div class="sub">Diagnóstico do Sistema · Onde o talento se encontra</div></div>
 </div>
 <button id="btnRun" type="button">▶ Executar Diagnóstico</button>
</header>
<div class="grid">
 <div class="stat"><b id="cOk" style="color:var(--ok)">0</b><small>Online</small></div>
 <div class="stat"><b id="cOff" style="color:var(--er)">0</b><small>Offline</small></div>
 <div class="stat"><b id="cWarn" style="color:var(--am)">0</b><small>Avisos</small></div>
</div>
<div class="sec">🔌 API · Locaweb</div><div id="rApi"></div>
<div class="sec">📄 Ficheiros · GitHub Pages</div><div id="rFiles"></div>
<div class="sec">📋 Registo</div><div class="log" id="log">A aguardar execução…</div>
<footer>Kongo Arena © 2026 · Desenvolvido por TanqueDigital</footer>
</div>
<script>
'use strict';
var API = 'https://tanquedigital.com.br/kongo/api/index.php';
var ok = 0, off = 0, warn = 0;
function log(msg, cls) {
  var el = document.getElementById('log');
  if (el.innerHTML.indexOf('A aguardar') !== -1) el.innerHTML = '';
  var d = document.createElement('div');
  d.style.color = cls === 'ok' ? '#2ecc71' : (cls === 'off' ? '#e74c3c' : '#f39c12');
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}
function card(box, label, url) {
  var id = 'c' + Math.random().toString(36).slice(2, 10);
  var div = document.createElement('div');
  div.className = 'card'; div.id = id;
  div.innerHTML = '<div style="flex:1;min-width:200px"><div class="lbl"></div><div class="url"></div></div><div class="badge wait">A testar…</div>';
  div.querySelector('.lbl').textContent = label;
  div.querySelector('.url').textContent = url;
  document.getElementById(box).appendChild(div);
  return id;
}
function badge(id, type, text, ms) {
  var el = document.getElementById(id); if (!el) return;
  var b = el.querySelector('.badge');
  b.className = 'badge ' + type;
  b.textContent = text + (ms !== null ? ' · ' + ms + 'ms' : '');
  if (type === 'on') ok++; else if (type === 'off') off++; else warn++;
  document.getElementById('cOk').textContent = ok;
  document.getElementById('cOff').textContent = off;
  document.getElementById('cWarn').textContent = warn;
}
function ping(url, cors) {
  var s = performance.now();
  return fetch(url, {cache: 'no-store', mode: cors ? 'cors' : 'same-origin'})
    .then(function (r) { return {ok: r.ok, ms: Math.round(performance.now() - s), cors: false}; })
    .catch(function () { return {ok: false, ms: Math.round(performance.now() - s), cors: true}; });
}
function run() {
  var btn = document.getElementById('btnRun');
  btn.disabled = true; btn.textContent = 'A diagnosticar…';
  ok = 0; off = 0; warn = 0;
  document.getElementById('rApi').innerHTML = '';
  document.getElementById('rFiles').innerHTML = '';
  document.getElementById('log').innerHTML = '';
  log('Início do diagnóstico…');
  var jobs = [];
  [['Raiz da API', API], ['Health Check', API + '?action=health']].forEach(function (t) {
    var id = card('rApi', t[0], t[1]);
    jobs.push(ping(t[1], true).then(function (r) {
      if (r.cors) { badge(id, 'warn', 'CORS/SSL', r.ms); log('⚠ ' + t[0] + ': bloqueado pelo navegador (CORS ou SSL).', 'warn'); }
      else if (r.ok) { badge(id, 'on', 'ONLINE', r.ms); log('✓ ' + t[0] + ' online (' + r.ms + 'ms)', 'ok'); }
      else { badge(id, 'off', 'OFFLINE', r.ms); log('✗ ' + t[0] + ' offline', 'off'); }
    }));
  });
  [['Página Inicial', './index.html'], ['Login', './login.html'], ['Validação QR', './validar.html']].forEach(function (t) {
    var id = card('rFiles', t[0], t[1]);
    jobs.push(ping(t[1], false).then(function (r) {
      if (r.ok) { badge(id, 'on', 'ONLINE', r.ms); log('✓ ' + t[0] + ' encontrado', 'ok'); }
      else { badge(id, 'off', 'OFFLINE', r.ms); log('✗ ' + t[0] + ' não encontrado', 'off'); }
    }));
  });
  Promise.all(jobs).then(function () {
    log('Diagnóstico concluído.', 'ok');
    btn.disabled = false; btn.textContent = '↻ Executar Novamente';
  });
}
document.getElementById('btnRun').addEventListener('click', run);
</script>
</body>
</html>
